name: Build CodeBank

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NuGet packages
        run: nuget restore CodeBank.sln

      - name: Build
        run: msbuild CodeBank.sln /p:Configuration=Release /m
