name: Build CodeBank

on:
  push:
    branches:
      - master
      - "v*"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebank-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CodeBank.sln

      - name: Verify .NET Framework 4.6.1 reference assemblies
        shell: pwsh
        run: |
          $frameworkPath = Join-Path $env:GITHUB_WORKSPACE "packages/Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3/build/.NETFramework/v4.6.1"
          if (-not (Test-Path (Join-Path $frameworkPath "mscorlib.dll"))) {
            Write-Error "The .NET Framework 4.6.1 reference assemblies were not restored."
            exit 1
          }
          "FRAMEWORK_REFERENCE_PATH=$frameworkPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build solution
        run: msbuild CodeBank.sln /p:Configuration=Release /p:FrameworkPathOverride="${{ env.FRAMEWORK_REFERENCE_PATH }}" /m /v:minimal

      - name: Run unit tests
        run: dotnet test CodeBank.Tests/CodeBank.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal" --logger "trx;LogFileName=CodeBank.Tests.trx" --results-directory TestResults

      - name: Upload application build
        uses: actions/upload-artifact@v4
        with:
          name: CodeBank-build
          path: CodeBank/bin/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBank-test-results
          path: "TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 14
