name: Build CodeBank

on:
  push:
    branches:
      - master
      - "v*"
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CodeBank.sln

      - name: Build
        shell: pwsh
        run: |
          $referenceRoot = Join-Path $env:GITHUB_WORKSPACE "packages/Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3/build/.NETFramework"
          if (-not (Test-Path (Join-Path $referenceRoot "v4.6.1"))) {
            throw ".NET Framework 4.6.1 reference assemblies were not restored."
          }
          msbuild CodeBank.sln /p:Configuration=Release /p:TargetFrameworkRootPath="$referenceRoot/" /m /v:minimal
