name: Release CodeBank

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: codebank-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CodeBank.sln

      - name: Verify .NET Framework 4.6.1 reference assemblies
        shell: pwsh
        run: |
          $frameworkPath = Join-Path $env:GITHUB_WORKSPACE "packages/Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3/build/.NETFramework/v4.6.1"
          if (-not (Test-Path (Join-Path $frameworkPath "mscorlib.dll"))) {
            Write-Error "The .NET Framework 4.6.1 reference assemblies were not restored."
            exit 1
          }
          "FRAMEWORK_REFERENCE_PATH=$frameworkPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare assembly version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Release tags must use semantic version format vMAJOR.MINOR.PATCH."
            exit 1
          }
          $assemblyVersion = "$version.0"
          $assemblyInfo = "CodeBank/Properties/AssemblyInfo.cs"
          $assemblyContent = Get-Content $assemblyInfo -Raw
          $assemblyContent = [regex]::Replace($assemblyContent, 'AssemblyVersion\("[^"]+"\)', ('AssemblyVersion("{0}")' -f $assemblyVersion))
          $assemblyContent = [regex]::Replace($assemblyContent, 'AssemblyFileVersion\("[^"]+"\)', ('AssemblyFileVersion("{0}")' -f $assemblyVersion))
          Set-Content -Path $assemblyInfo -Value $assemblyContent -Encoding UTF8

      - name: Build solution
        run: msbuild CodeBank.sln /p:Configuration=Release /p:FrameworkPathOverride="${{ env.FRAMEWORK_REFERENCE_PATH }}" /m /v:minimal

      - name: Run unit tests
        run: dotnet test CodeBank.Tests/CodeBank.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/installer" | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            Write-Error "Inno Setup compiler was not found."
            exit 1
          }
          & $compiler "installer/CodeBank.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/installer/CodeBank-Setup-*.exe
